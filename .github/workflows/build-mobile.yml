name: Build unibook mobile apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "android/**", "ios/**", "capacitor.config.ts", "mobile/**", "scripts/prepare-mobile.ts", ".github/workflows/build-mobile.yml"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - run: bun install
      - run: bun scripts/prepare-mobile.ts
      - run: bunx cap sync android
      - name: Build signed APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KS"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - using a temporary key (fine for testing, NOT for Google Play updates)."
            export ANDROID_KEYSTORE_PASSWORD=unibook_ci ANDROID_KEY_ALIAS=unibook ANDROID_KEY_PASSWORD=unibook_ci
            keytool -genkeypair -keystore "$KS" -alias unibook -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass unibook_ci -keypass unibook_ci -dname "CN=unibook, O=unibook, C=SA"
          fi
          export ANDROID_KEYSTORE_PATH="$KS"
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Prepare release files
        run: |
          mkdir -p release-files
          cp android/app/build/outputs/apk/release/*.apk release-files/unibook-app.apk
          cp android/app/build/outputs/bundle/release/*.aab release-files/unibook-app.aab
      - uses: actions/upload-artifact@v4
        with:
          name: unibook-Android
          path: release-files/*
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0-mobile"
          gh release delete "$TAG_NAME" --yes || true
          git push origin :refs/tags/"$TAG_NAME" 2>/dev/null || true
          gh release create "$TAG_NAME" release-files/unibook-app.apk release-files/unibook-app.aab \
            --title "تطبيق unibook للجوال (Android APK & AAB)" \
            --notes "### 📱 تطبيق unibook للهواتف الذكية (Android)

          - **unibook-app.apk**: ملف التطبيق المباشر للتثبيت الفوري على أي هاتف أندرويد.
          - **unibook-app.aab**: حزمة Android App Bundle المعتمدة لرفع التطبيق على متجر Google Play Console.

          - **اسم الحزمة (Package ID)**: \`store.unibook.app\`
          - **الموقع المرتبط**: https://unibook.store"

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun scripts/prepare-mobile.ts
      - run: bunx cap sync ios
      - name: Compile unsigned device build + simulator build
        run: |
          set -e
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          ditto -c -k --keepParent build/device/Build/Products/Release-iphoneos/App.app build/unibook-iOS-Unsigned.zip
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent build/sim/Build/Products/Debug-iphonesimulator/App.app build/unibook-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: unibook-iOS
          path: build/*.zip
          if-no-files-found: error
